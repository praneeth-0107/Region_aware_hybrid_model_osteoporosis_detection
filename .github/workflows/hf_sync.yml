name: Sync to Hugging Face hub
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true
      - name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "${{ secrets.HF_TOKEN }}" ]; then
            echo "Error: HF_TOKEN secret is missing!"
            exit 1
          fi
          
          # Remove the github history to prevent past binary files from blocking the push
          rm -rf .git
          
          # Configure Git
          git config --global user.email "bot@huggingface.co"
          git config --global user.name "Hugging Face Sync Bot"
          
          # Initialize a fresh git repo
          git init
          git checkout -b main
          
          # Track large files explicitly
          git lfs install
          git lfs track "*.pth" "*.png" "*.pdf" "*.mp4" "*.docx"
          
          # Commit only the current files
          git add .
          git commit -m "Sync to Hugging Face Space"
          
          # Push forcefully to the space
          git push --force https://${{ secrets.HF_USERNAME }}:${{ secrets.HF_TOKEN }}@huggingface.co/spaces/${{ secrets.HF_USERNAME }}/${{ secrets.HF_SPACE_NAME }} main
